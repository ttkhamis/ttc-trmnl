name: Push TTC Alerts to TRMNL

on:
  schedule:
    # 6–8 AM ET — covers both EST (UTC-5) and EDT (UTC-4)
    - cron: '*/5 10-13 * * 1-5'
    # 3–5 PM ET — covers both EST (UTC-5) and EDT (UTC-4)
    - cron: '*/5 19-22 * * 1-5'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch alerts and push to TRMNL
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: python fetch_and_push.py
