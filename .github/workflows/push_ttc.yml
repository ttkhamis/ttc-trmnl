name: Push TTC Alerts to TRMNL

on:
  schedule:
    # TESTING — every 30 min, all day
    - cron: '*/30 * * * *'
    # Production schedules (re-enable when done testing):
    # - cron: '*/5 10-13 * * 1-5'   # 6–8 AM ET
    # - cron: '*/5 19-22 * * 1-5'   # 3–5 PM ET
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch alerts and push to TRMNL
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
        run: python fetch_and_push.py
